name: Sync Fork with Upstream
on:
  schedule:
    - cron: '0 8 * * *'  # UTC 每天8点跑，对应国内下午16点；自己改
  workflow_dispatch:     # 支持页面手动触发

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Sync fork upstream
        uses: aormsby/Fork-Sync-With-Upstream-action@v3
        with:
          upstream_repository: 原作者/原仓库
          target_branch: main
          upstream_branch: main
          sync_tags: true
          github_token: ${{ secrets.GITHUB_TOKEN }}
